name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.9.4-beta.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      HAS_SIGNING_CREDENTIALS: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 != '' && secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_PRIVATE_KEY_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release input
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          script/verify_core_ref.sh
          script/verify_ats_policy.sh

      - name: Require signing and notarization credentials
        if: env.HAS_SIGNING_CREDENTIALS != 'true'
        shell: bash
        run: |
          echo "Developer ID and Apple notarization credentials are required for a release" >&2
          exit 1

      - name: Test
        env:
          READBOARD_CORE_PATH: ${{ runner.temp }}/no-local-core
        run: swift test

      - name: Build iOS release
        run: |
          xcodebuild -quiet \
            -project ReadBoardGo.xcodeproj \
            -scheme ReadBoardGo \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/readboard-go-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package universal macOS app
        env:
          READBOARD_OUTPUT_DIR: ${{ runner.temp }}/release
          READBOARD_DERIVED_DATA: ${{ runner.temp }}/readboard-go-macos
          READBOARD_VERSION: ${{ env.RELEASE_VERSION }}
          READBOARD_BUILD_NUMBER: ${{ github.run_number }}
        run: script/package_macos.sh

      - name: Sign and notarize when credentials are configured
        if: env.HAS_SIGNING_CREDENTIALS == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/release/ReadBoard Go.app"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/readboard-go-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          [ -n "$IDENTITY" ]
          codesign --deep --force --sign "$IDENTITY" --options runtime --timestamp "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          SUBMISSION_ZIP="$RUNNER_TEMP/ReadBoard-Go-notarization.zip"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          ditto -c -k --keepParent "$APP" "$SUBMISSION_ZIP"
          xcrun notarytool submit "$SUBMISSION_ZIP" \
            --key "$API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          security delete-keychain "$KEYCHAIN_PATH"

      - name: Create release archive
        id: archive
        shell: bash
        run: |
          ARCHIVE="$RUNNER_TEMP/ReadBoard-Go-${RELEASE_VERSION#v}-macOS-universal.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/release/ReadBoard Go.app" "$ARCHIVE"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
        shell: bash
        run: |
          FLAGS=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$RELEASE_VERSION" "$ARCHIVE_PATH" \
            --target "$GITHUB_SHA" \
            --title "ReadBoard Go $RELEASE_VERSION" \
            --generate-notes "${FLAGS[@]}"
