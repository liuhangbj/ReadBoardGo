name: ReadBoardGo
options:
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true
packages:
  ReadBoardGoCore:
    path: .
  ReadBoard:
    url: https://github.com/liuhangbj/ReadBoard.git
    revision: 7511c1fe5dc210f0b3591ead3acb3afc3483df3a
targets:
  ReadBoardGo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info-iOS.plist
          - Info-macOS.plist
          - ShareExtension-Info.plist
          - ShareExtension-Info-iOS.plist
    dependencies:
      - target: ReadBoardGoShareIOS
        embed: true
      - package: ReadBoardGoCore
        product: ReadBoardGoCore
      - package: ReadBoard
        product: ReadBoardContract
      - package: ReadBoard
        product: ReadBoardUI
      - package: ReadBoard
        product: ReadBoardFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hangbits.ReadBoardGo
        PRODUCT_NAME: ReadBoard Go
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info-iOS.plist
        CODE_SIGN_STYLE: Automatic
  ReadBoardGoShareIOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension/ShareViewControllerIOS.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hangbits.ReadBoardGo.share
        PRODUCT_NAME: ReadBoard Go Share
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: App/ShareExtension-Info-iOS.plist
        CODE_SIGN_STYLE: Automatic
  ReadBoardGoMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes:
          - Info-iOS.plist
          - Info-macOS.plist
          - ShareExtension-Info.plist
          - ShareExtension-Info-iOS.plist
    dependencies:
      - package: ReadBoardGoCore
        product: ReadBoardGoCore
      - package: ReadBoard
        product: ReadBoardContract
      - package: ReadBoard
        product: ReadBoardRemote
      - package: ReadBoard
        product: ReadBoardUI
      - package: ReadBoard
        product: ReadBoardFeatures
      - target: ReadBoardGoShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hangbits.ReadBoardGo.mac
        PRODUCT_NAME: ReadBoard Go
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: App/Info-macOS.plist
        CODE_SIGN_STYLE: Automatic
    postBuildScripts:
      - name: Package Icon Variants
        script: |
          "$SRCROOT/script/package_icon_variants.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIconLight.icns
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIconDark.icns
        basedOnDependencyAnalysis: false
  ReadBoardGoShare:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ShareExtension/ShareViewController.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hangbits.ReadBoardGo.mac.share
        PRODUCT_NAME: ReadBoard Go Share
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: App/ShareExtension-Info.plist
        CODE_SIGN_STYLE: Automatic
schemes:
  ReadBoardGo:
    build:
      targets:
        ReadBoardGo: all
    run:
      config: Debug
  ReadBoardGoMac:
    build:
      targets:
        ReadBoardGoMac: all
    run:
      config: Debug
